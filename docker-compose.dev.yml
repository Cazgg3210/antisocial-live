# Local development: Postgres 17 + Mailpit. The Next.js app runs on the host with `pnpm dev`.
services:
  postgres:
    image: postgres:17
    container_name: antisocial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: antisocial
      POSTGRES_USER: antisocial
      POSTGRES_PASSWORD: antisocial
    ports:
      - "5480:5432"
    volumes:
      - antisocial_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antisocial -d antisocial"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: antisocial-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  antisocial_postgres_data:
