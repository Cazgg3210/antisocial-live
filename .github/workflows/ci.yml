name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  DATABASE_URL: postgresql://antisocial:antisocial@127.0.0.1:5432/antisocial
  AUTH_SECRET: ci-only-admin-secret-0123456789abcdef0123456789abcdef
  VOTER_SESSION_SECRET: ci-only-voter-secret-0123456789abcdef0123456789abcdef
  SCREEN_CODE_SECRET: ci-only-screen-code-secret-0123456789
  APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  integration-e2e:
    name: integration · e2e
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: antisocial, POSTGRES_USER: antisocial, POSTGRES_PASSWORD: antisocial }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U antisocial" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm seed
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: E2E (against production build)
        run: |
          pnpm start &
          npx wait-on http://localhost:3000/api/health -t 60000
          E2E_BASE_URL=http://localhost:3000 pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: antisocial-live:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
