# Production / staging compose for Dokploy.
# Dokploy injects environment variables and attaches the Traefik network; the app only exposes port 3000 internally.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
      DATABASE_URL: postgresql://antisocial:${POSTGRES_PASSWORD}@postgres:5432/antisocial
      AUTH_SECRET: ${AUTH_SECRET}
      VOTER_SESSION_SECRET: ${VOTER_SESSION_SECRET}
      SCREEN_CODE_SECRET: ${SCREEN_CODE_SECRET}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DEPLOYMENT_FREEZE: ${DEPLOYMENT_FREEZE:-false}
      SEED_MINIMAL_ON_BOOT: ${SEED_MINIMAL_ON_BOOT:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      BUSINESS_TIMEZONE: America/Mexico_City
      DEFAULT_LOCALE: es-MX
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: antisocial
      POSTGRES_USER: antisocial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antisocial -d antisocial"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
